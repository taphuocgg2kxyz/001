<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localhost Stress Test Tool</title>
    <style>
        body {
            font-family: monospace;
            background-color: #1e1e1e;
            color: #00ff00;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #00ff00;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #000;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-family: monospace;
        }
        button {
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #00ff00;
            color: #000;
        }
        .stats {
            margin-top: 20px;
            border-top: 1px dashed #00ff00;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Localhost Stress Tester</h2>
    
    <label>URL Cần Test:</label>
    <input type="text" id="targetUrl" value="http://localhost:3000/api/test">

    <label>Số Luồng Đồng Thời (Concurrency):</label>
    <input type="number" id="concurrency" value="10">

    <button id="toggleBtn" onclick="toggleTest()">BẮT ĐẦU TEST</button>

    <div class="stats">
        <p>Trạng thái: <span id="status">Tạm dừng</span></p>
        <p>Thành công (2xx): <span id="successCount">0</span></p>
        <p>Thất bại (Error/Timeout): <span id="failCount">0</span></p>
        <p>Tốc độ: <span id="rps">0</span> req/s</p>
    </div>
</div>

<script>
    let isRunning = false;
    let successCount = 0;
    let failCount = 0;
    let requestsInLastSecond = 0;
    let intervalId = null;

    async function sendRequest(url) {
        if (!isRunning) return;
        try {
            // cache: 'no-store' để tránh trình duyệt lưu cache kết quả
            const response = await fetch(url, { method: 'GET', cache: 'no-store' });
            if (response.ok) {
                successCount++;
            } else {
                failCount++;
            }
        } catch (err) {
            failCount++;
        } finally {
            requestsInLastSecond++;
            if (isRunning) {
                // Tiếp tục gửi request tiếp theo ngay khi request này xong
                sendRequest(url);
            }
        }
    }

    function toggleTest() {
        const btn = document.getElementById('toggleBtn');
        const url = document.getElementById('targetUrl').value;
        const concurrency = parseInt(document.getElementById('concurrency').value) || 5;

        if (!isRunning) {
            isRunning = true;
            btn.innerText = "DỪNG TEST";
            document.getElementById('status').innerText = "Đang chạy...";
            
            // Khởi tạo các luồng chạy song song
            for (let i = 0; i < concurrency; i++) {
                sendRequest(url);
            }

            // Tính toán số Request Per Second (RPS)
            intervalId = setInterval(() => {
                document.getElementById('successCount').innerText = successCount;
                document.getElementById('failCount').innerText = failCount;
                document.getElementById('rps').innerText = requestsInLastSecond;
                requestsInLastSecond = 0;
            }, 1000);

        } else {
            isRunning = false;
            btn.innerText = "BẮT ĐẦU TEST";
            document.getElementById('status').innerText = "Tạm dừng";
            clearInterval(intervalId);
        }
    }
</script>

</body>
                                                    </html>
