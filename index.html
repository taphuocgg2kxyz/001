<!doctype html> <html lang="vi"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Localhost Stress Tester</title> <style> *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#102b20 0,#07100d 38%,#050706 100%);color:#eafff2;font-family:Inter,system-ui,-apple-system,sans-serif;padding:24px}.app{width:min(760px,100%);margin:auto}.header{text-align:center;margin:20px 0 28px}.logo{width:64px;height:64px;margin:auto;border:1px solid #00ff88;border-radius:18px;display:grid;place-items:center;background:#00ff8810;box-shadow:0 0 35px #00ff8830;font-size:30px}.header h1{margin:16px 0 6px;font-size:28px}.header p{margin:0;color:#78998a;font-size:14px}.card{background:#0a110eaa;border:1px solid #173a2a;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0008;backdrop-filter:blur(12px)}.field{margin-bottom:18px}.field label{display:block;font-size:12px;color:#82a393;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}.row{display:grid;grid-template-columns:1fr 180px;gap:14px}input{width:100%;height:46px;border:1px solid #244836;border-radius:10px;background:#050806;color:#dffff0;padding:0 14px;font:inherit;outline:0;transition:.2s}input:focus{border-color:#00ff88;box-shadow:0 0 0 3px #00ff8812}.actions{display:flex;gap:10px;margin-top:8px}button{height:48px;border:0;border-radius:10px;font-weight:800;font:inherit;cursor:pointer;transition:.2s}.start{flex:1;background:#00e87a;color:#001b0e;box-shadow:0 8px 25px #00ff8830}.start:hover{background:#35ff9b;transform:translateY(-1px)}.start.running{background:#ff416c;color:#fff;box-shadow:0 8px 25px #ff416c30}.reset{width:110px;background:#14231c;color:#9bb8a9;border:1px solid #244836}.reset:hover{background:#1b3026;color:#fff}.status{display:flex;align-items:center;gap:9px;margin-top:20px;padding:12px 14px;background:#07100c;border:1px solid #173a2a;border-radius:10px;color:#91ad9f;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#53675c}.dot.on{background:#00ff88;box-shadow:0 0 12px #00ff88;animation:pulse 1s infinite}.dot.err{background:#ff416c;box-shadow:0 0 12px #ff416c}@keyframes pulse{50%{opacity:.4}}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.stat{background:#080e0b;border:1px solid #173a2a;border-radius:14px;padding:16px}.stat small{display:block;color:#668274;font-size:11px;text-transform:uppercase;letter-spacing:.07em}.stat strong{display:block;margin-top:7px;font-size:25px}.success strong{color:#00ff88}.fail strong{color:#ff5c7c}.rps strong{color:#64c7ff}.footer{text-align:center;color:#50665a;font-size:11px;margin-top:18px}@media(max-width:600px){body{padding:14px}.card{padding:16px}.row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.rps{grid-column:1/-1}.actions{flex-direction:column}.reset{width:100%}} </style> </head> <body> <main class="app"> <header class="header"> <div class="logo">⚡</div> <h1>Localhost Stress Tester</h1> <p>Công cụ kiểm thử tải HTTP dành cho môi trường local</p> </header> <section class="card"> <div class="field"> <label for="targetUrl">Target URL</label> <input id="targetUrl" value="http://localhost:3000/api/test" placeholder="http://localhost:3000/api/test"> </div> <div class="row"> <div class="field"> <label for="concurrency">Concurrency</label> <input id="concurrency" type="number" min="1" max="500" value="10"> </div> <div class="field"> <label for="timeout">Timeout (ms)</label> <input id="timeout" type="number" min="100" max="60000" value="5000"> </div> </div> <div class="actions"> <button class="start" id="toggleBtn">▶ BẮT ĐẦU TEST</button> <button class="reset" id="resetBtn">↻ Reset</button> </div> <div class="status"> <span class="dot" id="dot"></span> <span id="status">Sẵn sàng kiểm thử</span> </div> <div class="stats"> <div class="stat success"><small>Thành công 2xx</small><strong id="successCount">0</strong></div> <div class="stat fail"><small>Thất bại</small><strong id="failCount">0</strong></div> <div class="stat rps"><small>Requests / sec</small><strong id="rps">0</strong></div> </div> </section> <div class="footer">⚠ Chỉ sử dụng với localhost hoặc hệ thống bạn được phép kiểm thử.</div> </main> <script> let running=false,success=0,fail=0,total=0,currentRps=0,timer; const $=id=>document.getElementById(id); const btn=$("toggleBtn"),dot=$("dot"); function render(){ $("successCount").textContent=success.toLocaleString(); $("failCount").textContent=fail.toLocaleString(); $("rps").textContent=currentRps.toLocaleString(); } async function worker(url,timeout){ while(running){ const controller=new AbortController(); const t=setTimeout(()=>controller.abort(),timeout); try{ const res=await fetch(url,{method:"GET",cache:"no-store",signal:controller.signal}); res.ok?success++:fail++; }catch{fail++} finally{ clearTimeout(t); total++; currentRps++; } } } function start(){ const url=$("targetUrl").value.trim(); const concurrency=Math.min(500,Math.max(1,parseInt($("concurrency").value)||10)); const timeout=Math.min(60000,Math.max(100,parseInt($("timeout").value)||5000)); if(!url)return alert("Vui lòng nhập Target URL."); try{new URL(url)}catch{return alert("URL không hợp lệ.");} success=fail=total=currentRps=0; running=true; btn.textContent="■ DỪNG TEST"; btn.classList.add("running"); dot.classList.add("on"); $("status").textContent=`Đang chạy • ${concurrency} workers`; for(let i=0;i<concurrency;i++)worker(url,timeout); timer=setInterval(render,1000); } function stop(){ running=false; clearInterval(timer); btn.textContent="▶ BẮT ĐẦU TEST"; btn.classList.remove("running"); dot.classList.remove("on"); $("status").textContent=`Đã dừng • ${total.toLocaleString()} requests`; render(); } btn.onclick=()=>running?stop():start(); $("resetBtn").onclick=()=>{ if(running)stop(); success=fail=total=currentRps=0; $("status").textContent="Sẵn sàng kiểm thử"; dot.classList.remove("err"); render(); }; </script> </body> </html>
