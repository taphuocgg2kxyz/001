<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra Địa chỉ IP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .info-group {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .label {
            font-weight: bold;
            color: #666;
        }
        .value {
            color: #007bff;
            font-weight: 600;
        }
        #ip {
            font-size: 1.2rem;
            color: #28a745;
        }
        .loading {
            text-align: center;
            color: #888;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Thông tin IP của bạn</h2>
    <div id="content" class="loading">Đang tải dữ liệu...</div>
</div>

<script>
    async function checkIP() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            if (!response.ok) throw new Error('Không thể lấy dữ liệu');
            
            const data = await response.json();
            
            document.getElementById('content').innerHTML = `
                <div class="info-group">
                    <span class="label">Địa chỉ IP:</span>
                    <span class="value" id="ip">${data.ip}</span>
                </div>
                <div class="info-group">
                    <span class="label">Quốc gia:</span>
                    <span class="value">${data.country_name} (${data.country_code})</span>
                </div>
                <div class="info-group">
                    <span class="label">Thành phố / Tỉnh:</span>
                    <span class="value">${data.city}, ${data.region}</span>
                </div>
                <div class="info-group">
                    <span class="label">Nhà mạng (ISP):</span>
                    <span class="value">${data.org || data.asn}</span>
                </div>
                <div class="info-group">
                    <span class="label">Múi giờ:</span>
                    <span class="value">${data.timezone}</span>
                </div>
            `;
        } catch (error) {
            document.getElementById('content').innerHTML = `<p style="color:red; text-align:center;">Lỗi: ${error.message}</p>`;
        }
    }

    checkIP();
</script>

</body>
</html>
